name: Comprehensive Test Suite

on:
  pull_request:
    branches:
      - prod
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Who gets the suite ────────────────────────────────────────────
  # The two unit-test jobs (test-node, test-python) run on EVERY PR — see
  # sable-bm5k. The rest of the matrix runs for PRs into prod (the release
  # gate) and for outside contributions; for our own PRs into main it is
  # skipped, because re-running the 6-way cross-platform grid on work that
  # was reviewed before it was pushed mostly burns runner minutes.
  #
  # Note this is `pull_request`, not `pull_request_target` — fork PRs run with
  # a read-only token and no access to secrets. Do not "fix" that.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      run_core: ${{ steps.decide.outputs.run_core }}
    steps:
      # Checked out only so the skip notice below can read the list of gated
      # jobs from this file instead of carrying a copy of it. The first
      # hand-typed copy omitted e2e-node within the hour it was written.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/test-comprehensive.yml
          sparse-checkout-cone-mode: false

      - id: decide
        # Values go through env rather than direct ${{ }} interpolation into
        # the script, so nothing from the PR can be shell-injected.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # `run`      — the full matrix, including the 6-way cross-platform grid.
          # `run_core` — the two unit-test jobs. These now run on EVERY PR.
          #
          # sable-bm5k: the original gate skipped everything on internal PRs into
          # main, on the premise that our own work is tested locally first. On
          # #220 — which changed both the Node and the Python client — that meant
          # neither test-node nor test-python ran. The premise is also weaker
          # than it looks: this repo has test files that fail locally for
          # environmental reasons, so "green on my machine" is not a signal you
          # can act on. test-node (234s) and test-python (100s) run in parallel,
          # so this costs ~4 minutes of wall clock. The expensive part — the
          # cross-platform grid, 6 jobs and 3 of them macOS — stays gated.
          echo "run_core=true" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" != "pull_request" ] || [ "$BASE" != "main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_OWNER" = "Raftersecurity" ] || [ "$AUTHOR" = "Rome-1" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            # sable-d2x2 rule B — a skipped job renders as a grey check and
            # satisfies a required status check, so the skip has to be said
            # out loud, by name, where a reviewer looks: the checks annotation
            # and the run summary. The list is READ FROM THIS FILE (every job
            # whose `if:` is gated on needs.gate.outputs.run), never typed by
            # hand, so it cannot drift from the jobs it describes.
            SKIPPED_JOBS=$(awk '
              /^  [A-Za-z0-9_-]+:[[:space:]]*$/ { job=$1; sub(":", "", job) }
              /^[[:space:]]*if:.*needs\.gate\.outputs\.run == .true./ { if (job != "" && !seen[job]++) print job }
            ' .github/workflows/test-comprehensive.yml)
            SKIPPED_CSV=$(printf '%s' "$SKIPPED_JOBS" | paste -sd ',' - | sed 's/,/, /g')
            if [ -z "$SKIPPED_JOBS" ]; then
              echo "::error::gate: found no jobs gated on needs.gate.outputs.run — the skip notice would be empty. Either the gate is now pointless or this awk no longer matches the file."
              exit 1
            fi
            echo "::warning::Internal PR into main: extended matrix NOT run — ${SKIPPED_CSV}. Unit tests (test-node, test-python) still run. To run everything, push to a branch and open the PR from a fork, or use workflow_dispatch."
            {
              echo "### Extended matrix skipped on this run"
              echo ""
              echo "Internal PR into main (author=\`$AUTHOR\`, head repo owner=\`$HEAD_OWNER\`). These jobs did **not** run and their grey checks mean *skipped*, not *passed*:"
              echo ""
              printf '%s\n' "$SKIPPED_JOBS" | sed 's/.*/- `&`/'
              echo ""
              echo "\`test-node\` and \`test-python\` ran. Trigger the full matrix with **workflow_dispatch** if this PR touches packaging, SARIF output, secret patterns, or platform-specific code."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Unit & integration tests (both languages) ─────────────────────
  test-node:
    needs: gate
    if: needs.gate.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (for cross-runtime parity tests)
        working-directory: ./python
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .

      # The rf-6pqx differential compares this branch's classifier against
      # main's, and it FAILS rather than skips when the baseline is missing —
      # correctly, since a differential that silently skips is a vacuous gate.
      # actions/checkout fetches only the PR ref, so `origin/main` is not in the
      # clone and the gate cannot run at all. A depth-1 fetch is enough: the
      # gate reads one blob, not the history.
      - name: Fetch main for the differential gate
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Build
        run: pnpm run build

      - name: Verify build
        # Smoke-test that dist/index.js loads and the CLI runs. We can't use
        # `node -e "import(...)"` because importing index.js triggers
        # `program.parse()` synchronously; with no args Commander prints help
        # and exits 1 (Node 20 / Commander 11), so the .then() never runs.
        # `--version` is a real Commander action that exits 0 cleanly.
        run: node ./dist/index.js --version

      - name: Run all tests
        # The JSON report feeds the floor check below; the default reporter
        # keeps the log readable.
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=vitest-report.json
        env:
          RAFTER_API_KEY: ${{ secrets.RAFTER_API_KEY }}

      # sable-d2x2 rule C — a green run must have RUN something. Fails if the
      # executed count falls below the floor or any file's tests all skipped
      # (sable-cazq: 40 parity tests describe.skip'd, exit 0). The floor is
      # ~95% of the count on 2026-09-02 (2099 executed); lower it in the same
      # PR that removes tests, so a shrink is a reviewed decision.
      - name: Assert the suite actually ran
        run: python3 ../.github/scripts/test_floor.py --vitest vitest-report.json --min-executed 1990 --label "test-node (vitest)"

      # The battery is the gate that catches a MISSING fix; the differential
      # cannot, because a fix absent on both sides is not a permissive move.
      # That makes the battery's CONTENTS load-bearing, so they get a floor of
      # their own — in both directions, since a fix bought with an over-block
      # is how #230 happened.
      - name: Assert the classifier battery still gates both directions
        run: python3 ../.github/scripts/classifier_battery_floor.py --min-cases 44

  test-python:
    needs: gate
    if: needs.gate.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-mock pytest-asyncio

      # Same reason as test-node: the differential FAILS rather than skips
      # when main's classifier is unobtainable, and actions/checkout fetches
      # only the PR ref. One blob is all the gate needs.
      - name: Fetch main for the differential gate
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Run all tests
        # xunit1 is the JUnit family that records `file` per test case, which
        # the floor check below groups by.
        run: python -m pytest tests/ -v -o junit_family=xunit1 --junitxml=pytest-report.xml
        env:
          RAFTER_API_KEY: ${{ secrets.RAFTER_API_KEY }}

      # sable-d2x2 rule C — see test-node. Floor is ~95% of 1614 executed on
      # 2026-09-02.
      - name: Assert the suite actually ran
        run: python3 ../.github/scripts/test_floor.py --junit pytest-report.xml --min-executed 1530 --label "test-python (pytest)"

  # ── E2E CLI tests ─────────────────────────────────────────────────
  e2e-node:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Run e2e tests
        run: pnpm exec vitest run tests/e2e-cli.test.ts
        env:
          RAFTER_API_KEY: ${{ secrets.RAFTER_API_KEY }}

  # ── Secret detection accuracy ──────────────────────────────────────
  secret-detection-accuracy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Run pattern coverage tests
        run: pnpm exec vitest run tests/secret-patterns.test.ts

  # ── SARIF output validation ────────────────────────────────────────
  sarif-validation:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Generate SARIF from fixture
        run: |
          echo "AKIAIOSFODNN7EXAMPLE" > /tmp/test-secret.txt
          node dist/index.js scan local /tmp/test-secret.txt --engine patterns --format sarif > /tmp/output.sarif || true

      - name: Validate SARIF structure
        run: |
          node -e "
            const fs = require('fs');
            const sarif = JSON.parse(fs.readFileSync('/tmp/output.sarif', 'utf8'));
            if (sarif.version !== '2.1.0') throw new Error('Bad SARIF version');
            if (!sarif.runs || sarif.runs.length === 0) throw new Error('No runs');
            if (!sarif.runs[0].tool.driver.name) throw new Error('Missing tool name');
            if (sarif.runs[0].results.length === 0) throw new Error('No results');
            console.log('SARIF validation passed:', sarif.runs[0].results.length, 'findings');
          "

  # ── Remote API integration (only when key available) ───────────────
  backend-api:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      RAFTER_API_KEY: ${{ secrets.RAFTER_API_KEY }}
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Run backend API tests
        if: ${{ env.RAFTER_API_KEY != '' }}
        run: pnpm exec vitest run tests/backend-api.test.ts

      # sable-bm5k — without this the job renders identically whether it tested
      # the backend or tested nothing. RAFTER_API_KEY has never been set on this
      # repo, so "backend-api ✓" has always meant "checked out and built".
      # A skipped step must not look like a passing one.
      - name: Say so when the backend tests did not run
        if: ${{ env.RAFTER_API_KEY == '' }}
        run: |
          echo "::warning::backend-api tested NOTHING — RAFTER_API_KEY is not set, so tests/backend-api.test.ts was skipped."
          {
            echo "### :warning: backend-api ran no tests"
            echo ""
            echo "\`RAFTER_API_KEY\` is unset, so \`tests/backend-api.test.ts\` was skipped."
            echo "This job checked out and built the package and nothing else."
            echo ""
            echo "The remote scan path is covered without a key by the mock-backed jobs"
            echo "in \`test-github-action.yml\`. See sable-bm5k."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Package build verification ─────────────────────────────────────
  package-integrity:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Pack and verify contents
        run: |
          npm pack
          TARBALL=$(ls rafter-security-cli-*.tgz | head -1)

          # Verify essential files are in the tarball
          echo "Checking tarball contents..."
          tar -tzf "$TARBALL" | grep "resources/pre-commit-hook.sh" || (echo "FAIL: pre-commit-hook.sh missing" && exit 1)
          tar -tzf "$TARBALL" | grep "dist/index.js" || (echo "FAIL: dist/index.js missing" && exit 1)

          # Verify it installs and runs
          npm install -g "./$TARBALL"
          rafter --version
          rafter --help > /dev/null

          echo "Package integrity verified"

      - name: Test install-hook e2e
        run: |
          TMPDIR=$(mktemp -d)
          git init "$TMPDIR"
          git -C "$TMPDIR" config user.email "ci@test.local"
          git -C "$TMPDIR" config user.name "CI Test"
          (cd "$TMPDIR" && rafter agent install-hook)
          test -f "$TMPDIR/.git/hooks/pre-commit" || (echo "FAIL: hook not installed" && exit 1)
          echo "Hook installation verified"

  # ── Cross-platform smoke test ──────────────────────────────────────
  # Node 18 coverage that means something. package.json declares engines >=18
  # and the shipped code genuinely works there — but vitest 4 cannot run on 18
  # (engines ^20 || ^22 || >=24), so the old matrix leg tested the RUNNER's
  # unsupported path and reported on neither. This runs what a Node 18 USER
  # runs: the compiled dist, under Node 18, with no test framework in the way.
  #
  # Built on 20 and RUN on 18 on purpose — that is the user's situation, since
  # they install a prebuilt package rather than compiling it.
  #
  # Gated on `run_core`, not `run` like cross-platform was: run_core is true on
  # every PR. A skipped job satisfies a required check, so Node 18 coverage that
  # only sometimes runs is Node 18 coverage that can be absent exactly when it
  # matters.
  node18-smoke:
    needs: gate
    if: needs.gate.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install and build on a supported Node
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Switch the runtime only — the artifact under test is the one built above.
      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: The CLI runs on Node 18
        run: |
          node --version
          node ./dist/index.js --version

      # Asserts the rf-fuwy liveness probe BOTH ways: a live gate yields its
      # decision, an inert one yields none. Both directions are mutation-checked
      # — blanking the live fixture or making the inert one work fails the
      # script with its own message, not an import error.
      - name: The rf-fuwy liveness probe works on Node 18
        run: node scripts/node18-smoke.mjs

  cross-platform:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # vitest 4 declares engines ^20 || ^22 || >=24 — it does not run on Node
        # 18, so an 18 leg here exercised the RUNNER's unsupported path and said
        # nothing about the shipped code. It failed intermittently for exactly
        # that reason (1 test of 2194, only on 18). Node 18 remains supported by
        # the PRODUCT — package.json engines >=18, measured 200/200 on the built
        # dist — and node18-smoke below is what actually tests that claim.
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      # The rf-6pqx differential compares this branch's classifier against main's
      # and FAILS rather than skips when the baseline is missing — correctly, but
      # that means EVERY job running the suite has to supply it. actions/checkout
      # fetches only the PR ref. A depth-1 fetch is enough: one blob, not history.
      - name: Fetch main for the differential gate
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify build
        # Smoke-test that dist/index.js loads and the CLI runs. We can't use
        # `node -e "import(...)"` because importing index.js triggers
        # `program.parse()` synchronously; with no args Commander prints help
        # and exits 1 (Node 20 / Commander 11), so the .then() never runs.
        # `--version` is a real Commander action that exits 0 cleanly.
        run: node ./dist/index.js --version

      - name: Run tests
        run: pnpm test
