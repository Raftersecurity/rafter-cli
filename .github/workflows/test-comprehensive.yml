name: Comprehensive Test Suite

on:
  pull_request:
    branches:
      - prod
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Who gets the suite ────────────────────────────────────────────
  # The two unit-test jobs (test-node, test-python) run on EVERY PR — see
  # sable-bm5k. The rest of the matrix runs for PRs into prod (the release
  # gate) and for outside contributions; for our own PRs into main it is
  # skipped, because re-running the 6-way cross-platform grid on work that
  # was reviewed before it was pushed mostly burns runner minutes.
  #
  # Note this is `pull_request`, not `pull_request_target` — fork PRs run with
  # a read-only token and no access to secrets. Do not "fix" that.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      run_core: ${{ steps.decide.outputs.run_core }}
    steps:
      - id: decide
        # Values go through env rather than direct ${{ }} interpolation into
        # the script, so nothing from the PR can be shell-injected.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # `run`      — the full matrix, including the 6-way cross-platform grid.
          # `run_core` — the two unit-test jobs. These now run on EVERY PR.
          #
          # sable-bm5k: the original gate skipped everything on internal PRs into
          # main, on the premise that our own work is tested locally first. On
          # #220 — which changed both the Node and the Python client — that meant
          # neither test-node nor test-python ran. The premise is also weaker
          # than it looks: this repo has test files that fail locally for
          # environmental reasons, so "green on my machine" is not a signal you
          # can act on. test-node (234s) and test-python (100s) run in parallel,
          # so this costs ~4 minutes of wall clock. The expensive part — the
          # cross-platform grid, 6 jobs and 3 of them macOS — stays gated.
          echo "run_core=true" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" != "pull_request" ] || [ "$BASE" != "main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_OWNER" = "Raftersecurity" ] || [ "$AUTHOR" = "Rome-1" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Internal PR into main (author=$AUTHOR, head repo owner=$HEAD_OWNER) — unit tests still run; extended matrix skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Unit & integration tests (both languages) ─────────────────────
  test-node:
    needs: gate
    if: needs.gate.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (for cross-runtime parity tests)
        working-directory: ./python
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .

      - name: Build
        run: pnpm run build

      - name: Verify build
        # Smoke-test that dist/index.js loads and the CLI runs. We can't use
        # `node -e "import(...)"` because importing index.js triggers
        # `program.parse()` synchronously; with no args Commander prints help
        # and exits 1 (Node 20 / Commander 11), so the .then() never runs.
        # `--version` is a real Commander action that exits 0 cleanly.
        run: node ./dist/index.js --version

      - name: Run all tests
        run: pnpm test
        env:
          RAFTER_API_KEY: ${{ secrets.RAFTER_API_KEY }}

  test-python:
    needs: gate
    if: needs.gate.outputs.run_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-mock pytest-asyncio

      - name: Run all tests
        run: python -m pytest tests/ -v
        env:
          RAFTER_API_KEY: ${{ secrets.RAFTER_API_KEY }}

  # ── E2E CLI tests ─────────────────────────────────────────────────
  e2e-node:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Run e2e tests
        run: pnpm exec vitest run tests/e2e-cli.test.ts
        env:
          RAFTER_API_KEY: ${{ secrets.RAFTER_API_KEY }}

  # ── Secret detection accuracy ──────────────────────────────────────
  secret-detection-accuracy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Run pattern coverage tests
        run: pnpm exec vitest run tests/secret-patterns.test.ts

  # ── SARIF output validation ────────────────────────────────────────
  sarif-validation:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Generate SARIF from fixture
        run: |
          echo "AKIAIOSFODNN7EXAMPLE" > /tmp/test-secret.txt
          node dist/index.js scan local /tmp/test-secret.txt --engine patterns --format sarif > /tmp/output.sarif || true

      - name: Validate SARIF structure
        run: |
          node -e "
            const fs = require('fs');
            const sarif = JSON.parse(fs.readFileSync('/tmp/output.sarif', 'utf8'));
            if (sarif.version !== '2.1.0') throw new Error('Bad SARIF version');
            if (!sarif.runs || sarif.runs.length === 0) throw new Error('No runs');
            if (!sarif.runs[0].tool.driver.name) throw new Error('Missing tool name');
            if (sarif.runs[0].results.length === 0) throw new Error('No results');
            console.log('SARIF validation passed:', sarif.runs[0].results.length, 'findings');
          "

  # ── Remote API integration (only when key available) ───────────────
  backend-api:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      RAFTER_API_KEY: ${{ secrets.RAFTER_API_KEY }}
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Run backend API tests
        if: ${{ env.RAFTER_API_KEY != '' }}
        run: pnpm exec vitest run tests/backend-api.test.ts

      # sable-bm5k — without this the job renders identically whether it tested
      # the backend or tested nothing. RAFTER_API_KEY has never been set on this
      # repo, so "backend-api ✓" has always meant "checked out and built".
      # A skipped step must not look like a passing one.
      - name: Say so when the backend tests did not run
        if: ${{ env.RAFTER_API_KEY == '' }}
        run: |
          echo "::warning::backend-api tested NOTHING — RAFTER_API_KEY is not set, so tests/backend-api.test.ts was skipped."
          {
            echo "### :warning: backend-api ran no tests"
            echo ""
            echo "\`RAFTER_API_KEY\` is unset, so \`tests/backend-api.test.ts\` was skipped."
            echo "This job checked out and built the package and nothing else."
            echo ""
            echo "The remote scan path is covered without a key by the mock-backed jobs"
            echo "in \`test-github-action.yml\`. See sable-bm5k."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Package build verification ─────────────────────────────────────
  package-integrity:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Pack and verify contents
        run: |
          npm pack
          TARBALL=$(ls rafter-security-cli-*.tgz | head -1)

          # Verify essential files are in the tarball
          echo "Checking tarball contents..."
          tar -tzf "$TARBALL" | grep "resources/pre-commit-hook.sh" || (echo "FAIL: pre-commit-hook.sh missing" && exit 1)
          tar -tzf "$TARBALL" | grep "dist/index.js" || (echo "FAIL: dist/index.js missing" && exit 1)

          # Verify it installs and runs
          npm install -g "./$TARBALL"
          rafter --version
          rafter --help > /dev/null

          echo "Package integrity verified"

      - name: Test install-hook e2e
        run: |
          TMPDIR=$(mktemp -d)
          git init "$TMPDIR"
          git -C "$TMPDIR" config user.email "ci@test.local"
          git -C "$TMPDIR" config user.name "CI Test"
          (cd "$TMPDIR" && rafter agent install-hook)
          test -f "$TMPDIR/.git/hooks/pre-commit" || (echo "FAIL: hook not installed" && exit 1)
          echo "Hook installation verified"

  # ── Cross-platform smoke test ──────────────────────────────────────
  cross-platform:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["18", "20", "22"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify build
        # Smoke-test that dist/index.js loads and the CLI runs. We can't use
        # `node -e "import(...)"` because importing index.js triggers
        # `program.parse()` synchronously; with no args Commander prints help
        # and exits 1 (Node 20 / Commander 11), so the .then() never runs.
        # `--version` is a real Commander action that exits 0 cleanly.
        run: node ./dist/index.js --version

      - name: Run tests
        run: pnpm test
