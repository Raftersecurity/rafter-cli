name: Test github-action/ Composite Action

# Runs on every PR touching github-action/ (the cloud-API variant) and on
# the same paths landing on main. The Rafter API is NOT exercised — these
# are pure-bash unit tests of the threshold-eval and PR-comment logic
# plus a drift detector on action.yml's load-bearing defaults.
#
# The poll-path jobs DO drive the action end to end, against a localhost mock
# backend (github-action/tests/mock-rafter-api.py) rather than the real API, so
# they need no API key and spend no credits.
on:
  push:
    branches:
      - main
    paths:
      - 'github-action/**'
      - '.github/workflows/test-github-action.yml'
  pull_request:
    paths:
      - 'github-action/**'
      - '.github/workflows/test-github-action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-threshold-evaluation:
    name: Threshold-evaluation case statement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run threshold-eval unit test
        run: bash github-action/tests/test-threshold-eval.sh

  test-pr-comment-tip:
    name: PR-comment report-only tip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PR-comment-tip unit test
        run: bash github-action/tests/test-pr-comment-tip.sh

  test-action-yml-defaults:
    name: action.yml drift detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run action.yml defaults / drift check
        run: bash github-action/tests/test-action-yml-defaults.sh

  # sable-l10k — a paying customer's run died on a single transient 500 during
  # polling ("Failed to fetch report from storage: Object not found"). The
  # report is not durable the instant a scan flips to completed, so that 500 is
  # survivable and must be retried. These two jobs pin both halves of the
  # contract: ride out the transient failure, still fail on a missing report.
  test-poll-transient-500:
    name: "Poll: rides out a transient 500"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (500 on poll #2, then healthy)
        env:
          PORT: '8787'
          FAIL_ON: '2'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8787/api/static/scan >/dev/null && break
            sleep 1
          done

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8787'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert the scan survived the 500
        run: |
          cat mock.log
          echo "status output: '${{ steps.scan.outputs.status }}'"
          if [ "${{ steps.scan.outputs.status }}" != "completed" ]; then
            echo "FAIL: a single transient 500 during polling killed the run."
            exit 1
          fi
          echo "PASS: the action retried the transient 500 and completed."

  test-poll-report-never-readable:
    name: "Poll: fails clearly when the report is really missing"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (every poll 500s)
        env:
          PORT: '8788'
          FAIL_ON: '2'
          FAIL_FOREVER: '1'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8788/api/static/scan >/dev/null && break
            sleep 1
          done

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8788'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert it failed, with the right status
        run: |
          cat mock.log
          FAIL=0
          if [ "${{ steps.scan.outputs.status }}" != "unreadable" ]; then
            echo "FAIL: expected status=unreadable, got '${{ steps.scan.outputs.status }}'"
            FAIL=1
          fi
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "FAIL: an unreadable report should fail the build."
            FAIL=1
          fi
          # A composite action's log is not capturable from the calling step,
          # so the CONTENT of the give-up message is asserted by the drift
          # detector (github-action/tests/test-action-yml-defaults.sh) instead.
          exit $FAIL

  # The 404-as-transient branch is the subtlest thing in the poll loop: it is
  # correct only because the trigger step has already handed us a scan_id.
  # Nothing else in CI exercises it, so a "simplification" that drops `-eq 404`
  # from the transient condition would otherwise land green.
  test-poll-transient-404:
    name: "Poll: rides out a transient 404"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (404 on poll #2, then healthy)
        env:
          PORT: '8789'
          FAIL_ON: '2'
          FAIL_STATUS: '404'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8789/api/static/scan >/dev/null && break
            sleep 1
          done
          curl -sf -X POST -d '{}' http://127.0.0.1:8789/api/static/scan >/dev/null || {
            echo "FAIL: mock backend never started"; cat mock.log; exit 1; }

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8789'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert the scan survived the 404
        run: |
          cat mock.log
          if [ "${{ steps.scan.outputs.status }}" != "completed" ]; then
            echo "FAIL: a transient 404 mid-poll killed the run."
            exit 1
          fi
          echo "PASS: the action treated a mid-poll 404 as read-after-write lag."

  # The results fetch runs the instant the scan reports completed — the
  # likeliest moment for the report object to be unreadable. Its retry loop had
  # no coverage at all, and it is where a failed read used to be reported to
  # consumers as status=completed.
  test-results-fetch-transient-500:
    name: "Results fetch: rides out a transient 500"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (poll succeeds, first results fetch 500s)
        env:
          PORT: '8790'
          FAIL_ON: '2'
          FAIL_COUNT: '1'
          COMPLETE_AFTER: '1'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8790/api/static/scan >/dev/null && break
            sleep 1
          done
          curl -sf -X POST -d '{}' http://127.0.0.1:8790/api/static/scan >/dev/null || {
            echo "FAIL: mock backend never started"; cat mock.log; exit 1; }

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8790'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert the results fetch retried rather than failing the build
        run: |
          cat mock.log
          if [ "${{ steps.scan.outputs.status }}" != "completed" ]; then
            echo "FAIL: a transient 500 on the results fetch killed the run (status='${{ steps.scan.outputs.status }}')."
            exit 1
          fi
          echo "PASS: the results fetch retried and completed."

  # sable-96ex — the day a rate limiter lands in front of the poll endpoint,
  # polling every 10s from every customer repo is exactly the traffic it
  # targets. A 429 is retried on one condition only: the server sent a
  # Retry-After saying when to come back. Without it a 429 on this API means
  # quota exhausted, and sleeping through five retries before failing anyway is
  # worse than failing now. These three jobs pin both halves.
  test-poll-429-with-retry-after:
    name: "Poll: rides out a 429 that carries Retry-After"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (429 + Retry-After on poll #2, then healthy)
        env:
          PORT: '8791'
          FAIL_ON: '2'
          FAIL_STATUS: '429'
          FAIL_RETRY_AFTER: '1'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8791/api/static/scan >/dev/null && break
            sleep 1
          done
          curl -sf -X POST -d '{}' http://127.0.0.1:8791/api/static/scan >/dev/null || {
            echo "FAIL: mock backend never started"; cat mock.log; exit 1; }

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8791'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert the scan survived the throttle
        run: |
          cat mock.log
          if [ "${{ steps.scan.outputs.status }}" != "completed" ]; then
            echo "FAIL: a 429 that told us when to come back killed the run (status='${{ steps.scan.outputs.status }}')."
            exit 1
          fi
          echo "PASS: the action honored Retry-After and completed."

  test-poll-429-without-retry-after:
    name: "Poll: a 429 with no Retry-After fails fast"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (bare 429 on poll #2)
        env:
          PORT: '8792'
          FAIL_ON: '2'
          FAIL_STATUS: '429'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8792/api/static/scan >/dev/null && break
            sleep 1
          done
          curl -sf -X POST -d '{}' http://127.0.0.1:8792/api/static/scan >/dev/null || {
            echo "FAIL: mock backend never started"; cat mock.log; exit 1; }

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8792'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert it failed immediately rather than retrying
        run: |
          cat mock.log
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "FAIL: a bare 429 (quota exhausted) did not fail the run."
            exit 1
          fi
          # The startup probe POSTs; only GETs are polls. Two of them means the
          # opening poll and the 429 — no retry. This is the half that catches a
          # 'simplification' making every 429 transient: that mutant retries to
          # a completed scan, six GETs and status=completed.
          gets=$(grep -c '"GET ' mock.log || true)
          if [ "$gets" -ne 2 ]; then
            echo "FAIL: expected exactly 2 polls (no retry), saw ${gets}."
            exit 1
          fi
          echo "PASS: a 429 with no Retry-After failed fast, without retrying."

  test-poll-429-duplicate-retry-after:
    name: "Poll: a repeated Retry-After is not a delay"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (429 carrying TWO Retry-After headers)
        env:
          PORT: '8794'
          FAIL_ON: '2'
          FAIL_STATUS: '429'
          FAIL_RETRY_AFTER: '5|900'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8794/api/static/scan >/dev/null && break
            sleep 1
          done
          curl -sf -X POST -d '{}' http://127.0.0.1:8794/api/static/scan >/dev/null || {
            echo "FAIL: mock backend never started"; cat mock.log; exit 1; }

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8794'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert it treated the ambiguous header as no header
        run: |
          cat mock.log
          # An origin's Retry-After and a proxy's are not a delay anyone can act
          # on. Both runtimes answer null here; the shell must not quietly pick
          # one and sleep on it.
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "FAIL: a repeated Retry-After was acted on instead of refused."
            exit 1
          fi
          gets=$(grep -c '"GET ' mock.log || true)
          if [ "$gets" -ne 2 ]; then
            echo "FAIL: expected exactly 2 polls (no retry), saw ${gets}."
            exit 1
          fi
          echo "PASS: a repeated Retry-After counted as absent, and the run failed fast."

  test-poll-429-early-hints-retry-after:
    name: "Poll: a hinted Retry-After is not the 429's own"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (103 Early Hints carries Retry-After, the 429 does not)
        env:
          PORT: '8795'
          FAIL_ON: '2'
          FAIL_STATUS: '429'
          EARLY_HINTS_RETRY_AFTER: '7'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8795/api/static/scan >/dev/null && break
            sleep 1
          done
          curl -sf -X POST -d '{}' http://127.0.0.1:8795/api/static/scan >/dev/null || {
            echo "FAIL: mock backend never started"; cat mock.log; exit 1; }

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8795'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert the hinted header was not read as the 429's
        run: |
          cat mock.log
          # `curl -D` dumps EVERY header block it received. Reading Retry-After
          # from the file without scoping it to the last block turns a bare 429
          # into a retried one — the single thing this branch exists to prevent.
          # Verified as non-vacuous: with a `grep | tail -n1` extraction this
          # mock config sleeps 7s and completes with 6 polls.
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "FAIL: an Early Hints Retry-After was honored for a bare 429."
            exit 1
          fi
          gets=$(grep -c '"GET ' mock.log || true)
          if [ "$gets" -ne 2 ]; then
            echo "FAIL: expected exactly 2 polls (no retry), saw ${gets}."
            exit 1
          fi
          echo "PASS: only the final response's Retry-After counted."

  test-poll-429-absurd-retry-after:
    name: "Poll: an absurd Retry-After cannot hang the job"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (429 forever, Retry-After of 23 digits)
        env:
          PORT: '8796'
          FAIL_ON: '2'
          FAIL_STATUS: '429'
          FAIL_FOREVER: '1'
          FAIL_RETRY_AFTER: '99999999999999999999999'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8796/api/static/scan >/dev/null && break
            sleep 1
          done
          curl -sf -X POST -d '{}' http://127.0.0.1:8796/api/static/scan >/dev/null || {
            echo "FAIL: mock backend never started"; cat mock.log; exit 1; }

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        timeout-minutes: 3
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8796'
          timeout-minutes: '1'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert it ended at the deadline instead of sleeping forever
        run: |
          cat mock.log
          # The value passes the digit guard, so only the LENGTH cap stands
          # between it and `sleep 99999999999999999999999`, which does not
          # return: `[ 1e23 -gt 60 ]` is a shell error that evaluates false, so
          # an uncapped value reaches sleep intact. Asserting the status output
          # is what makes this an artifact-level test rather than a grep over
          # the file — a hung step writes no status at all.
          if [ "${{ steps.scan.outputs.status }}" != "timeout" ]; then
            echo "FAIL: expected status=timeout at the deadline, got '${{ steps.scan.outputs.status }}'."
            exit 1
          fi
          echo "PASS: the honored delay stayed capped and the deadline held."

  test-results-fetch-429-with-retry-after:
    name: "Results fetch: rides out a 429 that carries Retry-After"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock backend (poll succeeds, first results fetch 429s)
        env:
          PORT: '8793'
          FAIL_ON: '2'
          FAIL_COUNT: '1'
          FAIL_STATUS: '429'
          FAIL_RETRY_AFTER: '1'
          COMPLETE_AFTER: '1'
        run: |
          nohup python3 github-action/tests/mock-rafter-api.py > mock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -X POST -d '{}' http://127.0.0.1:8793/api/static/scan >/dev/null && break
            sleep 1
          done
          curl -sf -X POST -d '{}' http://127.0.0.1:8793/api/static/scan >/dev/null || {
            echo "FAIL: mock backend never started"; cat mock.log; exit 1; }

      - name: Run the action against the mock
        id: scan
        continue-on-error: true
        uses: ./github-action
        with:
          api-key: 'not-a-real-key'
          rafter-url: 'http://127.0.0.1:8793'
          timeout-minutes: '2'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert the results fetch honored Retry-After
        run: |
          cat mock.log
          if [ "${{ steps.scan.outputs.status }}" != "completed" ]; then
            echo "FAIL: a throttled results fetch killed the run (status='${{ steps.scan.outputs.status }}')."
            exit 1
          fi
          echo "PASS: the results fetch honored Retry-After and completed."

  test-yaml-validity:
    name: action.yml is valid YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          python -c "import yaml; yaml.safe_load(open('github-action/action.yml'))" \
            && echo "OK: github-action/action.yml parses as valid YAML"
