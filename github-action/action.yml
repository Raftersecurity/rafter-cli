name: 'Rafter Security Scan'
description: 'Run Rafter security scans on your code. Finds vulnerabilities, secrets, and misconfigurations.'
author: 'Rafter Security'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Your Rafter API key (from rafter.so/dashboard/settings)'
    required: true
  scan-mode:
    description: 'Scan mode: "fast" for quick scans, "plus" for comprehensive analysis'
    required: false
    default: 'fast'
  severity-threshold:
    description: 'Fail the check if findings at this severity or above are found. Options: critical, high, medium, low, none. Default "none" so first-install never breaks a build; once you''ve triaged the baseline, set to "high" to enforce.'
    required: false
    default: 'none'
  comment-on-pr:
    description: 'Post scan results as a PR comment'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload SARIF results to GitHub Code Scanning'
    required: false
    default: 'true'
  timeout-minutes:
    description: 'Maximum wall-clock time to wait for scan completion (minutes). Enforced as a real deadline: before v0.11 this was a poll COUNT, so a slow API could overrun it.'
    required: false
    default: '10'
  rafter-url:
    description: 'Rafter API base URL (override for self-hosted instances)'
    required: false
    default: 'https://rafter.so'

outputs:
  scan-id:
    description: 'The Rafter scan ID'
    value: ${{ steps.scan.outputs.scan_id }}
  findings-count:
    description: 'Total number of findings'
    value: ${{ steps.results.outputs.findings_count }}
  critical-count:
    description: 'Number of critical/error findings'
    value: ${{ steps.results.outputs.critical_count }}
  high-count:
    description: 'Number of high/error findings'
    value: ${{ steps.results.outputs.high_count }}
  medium-count:
    description: 'Number of medium/warning findings'
    value: ${{ steps.results.outputs.medium_count }}
  low-count:
    description: 'Number of low/note findings'
    value: ${{ steps.results.outputs.low_count }}
  status:
    description: 'Scan status: completed, failed, timeout, unreadable (the scan may have finished but its report could not be read), or unreachable (the Rafter API could not be contacted)'
    value: ${{ steps.results.outputs.status || steps.poll.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Trigger Rafter scan
      id: scan
      shell: bash
      env:
        RAFTER_API_KEY: ${{ inputs.api-key }}
        RAFTER_URL: ${{ inputs.rafter-url }}
        SCAN_MODE: ${{ inputs.scan-mode }}
      run: |
        # --fail-with-body: non-2xx → body printed to stdout AND exit nonzero.
        # We capture body+status separately so future failures self-explain
        # (instead of just "curl exit 22"). API key never echoed.
        BODY_FILE="$(mktemp)"
        HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 \
          -o "$BODY_FILE" -w "%{http_code}" -X POST \
          -H "Content-Type: application/json" \
          -H "x-api-key: ${RAFTER_API_KEY}" \
          -d "{
            \"repository_name\": \"${{ github.repository }}\",
            \"branch_name\": \"${{ github.head_ref || github.ref_name }}\",
            \"scan_mode\": \"${SCAN_MODE}\"
          }" \
          "${RAFTER_URL}/api/static/scan") || {
            echo "::error::curl transport error contacting ${RAFTER_URL}/api/static/scan"
            cat "$BODY_FILE" || true
            rm -f "$BODY_FILE"
            exit 1
          }

        RESPONSE=$(cat "$BODY_FILE")
        rm -f "$BODY_FILE"

        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          ERROR=$(echo "$RESPONSE" | jq -r '.error // empty' 2>/dev/null | tr -d '\r\n' | cut -c1-200 || true)
          echo "::error::Rafter scan trigger failed: HTTP ${HTTP_CODE}"
          if [ -n "$ERROR" ]; then
            echo "::error::Server: ${ERROR}"
          else
            echo "Server response: $(printf '%s' "$RESPONSE" | tr -d '\r\n' | cut -c1-500)"
          fi
          exit 1
        fi

        SCAN_ID=$(echo "$RESPONSE" | jq -r '.scan_id // empty')
        # $GITHUB_OUTPUT is a key=value file: a newline in a server-controlled
        # scan_id forges arbitrary step outputs, including status=completed.
        # It also reaches ::error:: annotations and a request URL.
        case "$SCAN_ID" in
          *[!A-Za-z0-9_-]*)
            echo "::error::Rafter returned a malformed scan id; refusing to continue"
            exit 1
            ;;
        esac
        if [ -z "$SCAN_ID" ]; then
          ERROR=$(echo "$RESPONSE" | jq -r '.error // "Unknown error triggering scan"' | tr -d '\r\n' | cut -c1-200)
          echo "::error::Failed to trigger scan (HTTP ${HTTP_CODE}): ${ERROR}"
          exit 1
        fi

        echo "scan_id=${SCAN_ID}" >> "$GITHUB_OUTPUT"
        echo "Rafter scan triggered: ${SCAN_ID}"

    - name: Wait for scan completion
      id: poll
      shell: bash
      env:
        RAFTER_API_KEY: ${{ inputs.api-key }}
        RAFTER_URL: ${{ inputs.rafter-url }}
        SCAN_ID: ${{ steps.scan.outputs.scan_id }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        # sable-l10k — a report is not durable the instant the scan flips to
        # completed, so a poll can legitimately hit a 5xx (in practice
        # "Failed to fetch report from storage: Object not found") on a scan
        # that is perfectly healthy and readable seconds later. Retry those with
        # backoff. Only give up once the failures stop looking transient.
        #
        # 404 counts as transient HERE and only here: the trigger step already
        # handed us a scan_id, so a missing scan mid-poll is read-after-write
        # lag rather than a wrong id.
        case "$TIMEOUT_MINUTES" in
          ''|*[!0-9]*)
            echo "::error::timeout-minutes must be a whole number of minutes, got '${TIMEOUT_MINUTES}'"
            exit 1
            ;;
        esac

        MAX_TRANSIENT_FAILURES=5
        TRANSIENT_FAILURES=0
        LAST_ERROR=""

        # Wall-clock deadline so retry backoff cannot quietly stretch the
        # documented timeout-minutes budget.
        DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
        POLL_COUNT=0
        STATUS="pending"

        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          BODY_FILE="$(mktemp)"
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 \
            -o "$BODY_FILE" -w "%{http_code}" \
            -H "x-api-key: ${RAFTER_API_KEY}" \
            "${RAFTER_URL}/api/static/scan?scan_id=${SCAN_ID}") || {
              # A transport error is exactly as transient as a 5xx, and counts
              # the same. Previously it retried on a flat 10s forever, which
              # meant an unreachable backend reported "scan did not complete
              # within N minutes" — a timeout message for a DNS failure.
              rm -f "$BODY_FILE"
              LAST_ERROR="curl transport error contacting ${RAFTER_URL}"
              TRANSIENT_FAILURES=$((TRANSIENT_FAILURES+1))
              if [ "$TRANSIENT_FAILURES" -ge "$MAX_TRANSIENT_FAILURES" ]; then
                echo "::error::Rafter could not reach the API for scan ${SCAN_ID} after ${MAX_TRANSIENT_FAILURES} attempts."
                echo "::error::Check that ${RAFTER_URL} is reachable from this runner."
                echo "::error::Last error: ${LAST_ERROR}"
                echo "status=unreachable" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              BACKOFF=$(( 2 ** TRANSIENT_FAILURES ))
              echo "::warning::${LAST_ERROR}; retrying in ${BACKOFF}s (${TRANSIENT_FAILURES}/${MAX_TRANSIENT_FAILURES})"
              sleep "$BACKOFF"
              POLL_COUNT=$((POLL_COUNT+1))
              continue
            }
          RESPONSE=$(cat "$BODY_FILE")
          rm -f "$BODY_FILE"

          if [ "$HTTP_CODE" -ge 500 ] || [ "$HTTP_CODE" -eq 408 ] || [ "$HTTP_CODE" -eq 404 ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error // empty' 2>/dev/null | tr -d '\r\n' | cut -c1-200 || true)
            LAST_ERROR="HTTP ${HTTP_CODE}${ERROR:+ — $ERROR}"
            TRANSIENT_FAILURES=$((TRANSIENT_FAILURES+1))

            if [ "$TRANSIENT_FAILURES" -ge "$MAX_TRANSIENT_FAILURES" ]; then
              echo "::error::Rafter could not read the report for scan ${SCAN_ID} after ${MAX_TRANSIENT_FAILURES} attempts."
              echo "::error::The scan itself may have finished — check it in your dashboard at ${RAFTER_URL}/dashboard"
              echo "::error::Last response from the server: ${LAST_ERROR}"
              echo "status=unreadable" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            BACKOFF=$(( 2 ** TRANSIENT_FAILURES ))   # 2s, 4s, 8s, 16s
            echo "::warning::Report not readable yet (${LAST_ERROR}); retrying in ${BACKOFF}s (${TRANSIENT_FAILURES}/${MAX_TRANSIENT_FAILURES})"
            sleep "$BACKOFF"
            POLL_COUNT=$((POLL_COUNT+1))
            continue
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            # 4xx other than 404/408: a bad key or a malformed request. Retrying
            # will not help and would only delay a clear answer.
            ERROR=$(echo "$RESPONSE" | jq -r '.error // empty' 2>/dev/null | tr -d '\r\n' | cut -c1-200 || true)
            echo "::error::Rafter scan poll failed: HTTP ${HTTP_CODE}${ERROR:+ — $ERROR}"
            exit 1
          fi

          TRANSIENT_FAILURES=0
          STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')

          if [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ]; then
            break
          fi

          echo "Scan status: ${STATUS} (poll $((POLL_COUNT+1)), $(( (DEADLINE - $(date +%s)) / 60 ))m of ${TIMEOUT_MINUTES}m budget left)"
          sleep 10
          POLL_COUNT=$((POLL_COUNT+1))
        done

        if [ "$STATUS" = "failed" ]; then
          echo "::error::Rafter scan failed"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        elif [ "$STATUS" != "completed" ]; then
          echo "::error::Scan did not complete within ${TIMEOUT_MINUTES} minutes"
          echo "status=timeout" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        echo "status=completed" >> "$GITHUB_OUTPUT"
        echo "Scan completed successfully"

    - name: Fetch results
      id: results
      shell: bash
      env:
        RAFTER_API_KEY: ${{ inputs.api-key }}
        RAFTER_URL: ${{ inputs.rafter-url }}
        SCAN_ID: ${{ steps.scan.outputs.scan_id }}
      run: |
        # fetch_results <output-path> <url>: HTTP-status aware GET that surfaces
        # server error body on non-2xx (avoids silent curl exit 22 failures).
        #
        # sable-l10k — same read-after-write race as the poll loop, and worse
        # here: this runs the instant the scan reports completed, which is the
        # likeliest moment for the report object to not be readable yet. Retry
        # transient failures with backoff rather than failing the build.
        fetch_results() {
          local out="$1"
          local url="$2"
          local attempt=1
          local max_attempts=5
          local code body err last=""

          while :; do
            if code=$(curl -sS --connect-timeout 10 --max-time 60 \
              -o "$out" -w "%{http_code}" \
              -H "x-api-key: ${RAFTER_API_KEY}" "$url"); then
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                return 0
              fi
              body=$(cat "$out" || true)
              err=$(echo "$body" | jq -r '.error // empty' 2>/dev/null | tr -d '\r\n' | cut -c1-200 || true)
              last="HTTP ${code}${err:+ — $err}"
              if [ "$code" -lt 500 ] && [ "$code" -ne 408 ] && [ "$code" -ne 404 ]; then
                # Not transient — a bad key or malformed request. Say so now.
                echo "::error::Rafter results fetch failed: ${last}"
                echo "status=unreadable" >> "$GITHUB_OUTPUT"
                return 1
              fi
            else
              last="curl transport error fetching ${url}"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Rafter could not read the report for scan ${SCAN_ID} after ${max_attempts} attempts."
              echo "::error::The scan itself finished — check it in your dashboard at ${RAFTER_URL}/dashboard"
              echo "::error::Last response from the server: ${last}"
              # Without this the declared `status` output falls back to the poll
              # step, which already said `completed` — a failed report read would
              # be reported to consumers as a clean scan.
              echo "status=unreadable" >> "$GITHUB_OUTPUT"
              return 1
            fi

            local backoff=$(( 2 ** attempt ))
            echo "::warning::Report not readable yet (${last}); retrying in ${backoff}s (${attempt}/${max_attempts})"
            sleep "$backoff"
            attempt=$((attempt+1))
          done
        }

        fetch_results "${{ runner.temp }}/rafter-results.json"  "${RAFTER_URL}/api/static/scan?scan_id=${SCAN_ID}"
        fetch_results "${{ runner.temp }}/rafter-results.md"    "${RAFTER_URL}/api/static/scan?scan_id=${SCAN_ID}&format=md"
        fetch_results "${{ runner.temp }}/rafter-results.sarif" "${RAFTER_URL}/api/static/scan?scan_id=${SCAN_ID}&format=sarif"

        # A report this step cannot read is NOT a clean scan (sable-fgk7).
        # Every count below used to fall back to 0 on any jq failure, so a
        # malformed body, a truncated write, or a 200 carrying an error object
        # rendered as ":white_check_mark: No security findings detected" and
        # passed every severity threshold. Validate the shape first. Once it
        # holds, the count expressions cannot fail and need no fallback; if
        # jq itself is broken the step fails, which is the correct outcome.
        RESULTS="${{ runner.temp }}/rafter-results.json"
        if ! jq -e 'type == "object" and (.vulnerabilities | type == "array") and all(.vulnerabilities[]; type == "object")' "$RESULTS" >/dev/null 2>&1; then
          SNIPPET=$(head -c 300 "$RESULTS" 2>/dev/null | tr -d '\r\n' | cut -c1-200 || true)
          echo "::error::Rafter returned a report for scan ${SCAN_ID} that this action cannot read: no 'vulnerabilities' array."
          echo "::error::A report that cannot be parsed is not a clean scan, so no counts were produced. Check the scan in your dashboard at ${RAFTER_URL}/dashboard or retry with: rafter get ${SCAN_ID}"
          echo "::error::Body started with: ${SNIPPET}"
          echo "status=unreadable" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        FINDINGS_COUNT=$(jq '.vulnerabilities | length' "$RESULTS")
        CRITICAL_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "critical")] | length' "$RESULTS")
        HIGH_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "error" or .severity == "high")] | length' "$RESULTS")
        MEDIUM_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "warning" or .severity == "medium")] | length' "$RESULTS")
        LOW_COUNT=$(jq '[.vulnerabilities[] | select(.severity == "note" or .severity == "low")] | length' "$RESULTS")

        echo "findings_count=${FINDINGS_COUNT}" >> "$GITHUB_OUTPUT"
        echo "critical_count=${CRITICAL_COUNT}" >> "$GITHUB_OUTPUT"
        echo "high_count=${HIGH_COUNT}" >> "$GITHUB_OUTPUT"
        echo "medium_count=${MEDIUM_COUNT}" >> "$GITHUB_OUTPUT"
        echo "low_count=${LOW_COUNT}" >> "$GITHUB_OUTPUT"
        echo "status=completed" >> "$GITHUB_OUTPUT"

        echo "Found ${FINDINGS_COUNT} findings (critical: ${CRITICAL_COUNT}, high: ${HIGH_COUNT}, medium: ${MEDIUM_COUNT}, low: ${LOW_COUNT})"

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && steps.poll.outputs.status == 'completed'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/rafter-results.sarif
        category: rafter-security-scan
      continue-on-error: true

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' && steps.poll.outputs.status == 'completed'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SCAN_ID: ${{ steps.scan.outputs.scan_id }}
        FINDINGS_COUNT: ${{ steps.results.outputs.findings_count }}
        CRITICAL_COUNT: ${{ steps.results.outputs.critical_count }}
        HIGH_COUNT: ${{ steps.results.outputs.high_count }}
        MEDIUM_COUNT: ${{ steps.results.outputs.medium_count }}
        LOW_COUNT: ${{ steps.results.outputs.low_count }}
        SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
      run: |
        # Shared with the tests under tests/ — see lib/severity.sh (sable-1drb).
        source "${{ github.action_path }}/lib/severity.sh"

        MD_REPORT=$(jq -r '.markdown // empty' "${{ runner.temp }}/rafter-results.md" 2>/dev/null || cat "${{ runner.temp }}/rafter-results.md")

        if [ "$FINDINGS_COUNT" -eq 0 ]; then
          ICON="white_check_mark"
          HEADLINE="No security findings detected"
        elif [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
          ICON="rotating_light"
          HEADLINE="${FINDINGS_COUNT} security findings detected"
        else
          ICON="warning"
          HEADLINE="${FINDINGS_COUNT} security findings detected"
        fi

        # Build comment in a file. Using echo/printf (not a heredoc) because
        # an unindented heredoc body breaks the outer YAML `run: |` block scalar.
        COMMENT_FILE="${{ runner.temp }}/rafter-pr-comment.md"
        {
          echo "## :${ICON}: Rafter Security Scan"
          echo ""
          echo "**${HEADLINE}**"
          echo ""
          echo "| Severity | Count |"
          echo "|----------|-------|"
          echo "| Critical | ${CRITICAL_COUNT} |"
          echo "| High | ${HIGH_COUNT} |"
          echo "| Medium | ${MEDIUM_COUNT} |"
          echo "| Low | ${LOW_COUNT} |"
          echo ""
          echo "<details>"
          echo "<summary>Full Report</summary>"
          echo ""
        } > "$COMMENT_FILE"
        # printf '%s\n' preserves MD_REPORT verbatim (no shell re-expansion)
        printf '%s\n' "$MD_REPORT" >> "$COMMENT_FILE"
        {
          echo ""
          echo "</details>"
          echo ""
          rafter_report_only_tip "$FINDINGS_COUNT" "$SEVERITY_THRESHOLD"
          echo "---"
          echo "<sub>Scan ID: ${SCAN_ID} | Powered by [Rafter](https://rafter.so)</sub>"
        } >> "$COMMENT_FILE"

        # Delete previous Rafter comments to avoid spam
        EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
          --jq '.[] | select(.body | contains("Rafter Security Scan")) | .id' 2>/dev/null || true)
        for COMMENT_ID in $EXISTING; do
          gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" 2>/dev/null || true
        done

        gh pr comment "${{ github.event.pull_request.number }}" --body-file "$COMMENT_FILE"

    - name: Upload artifacts
      if: steps.results.outputs.status == 'completed'
      uses: actions/upload-artifact@v4
      with:
        name: rafter-security-results
        path: |
          ${{ runner.temp }}/rafter-results.json
          ${{ runner.temp }}/rafter-results.md
          ${{ runner.temp }}/rafter-results.sarif
        retention-days: 30

    - name: Evaluate severity threshold
      if: steps.poll.outputs.status == 'completed'
      shell: bash
      env:
        SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        CRITICAL_COUNT: ${{ steps.results.outputs.critical_count }}
        HIGH_COUNT: ${{ steps.results.outputs.high_count }}
        MEDIUM_COUNT: ${{ steps.results.outputs.medium_count }}
        LOW_COUNT: ${{ steps.results.outputs.low_count }}
      run: |
        # The case statement lives in lib/severity.sh so the unit tests under
        # tests/ run the same code, not a transcription of it (sable-1drb).
        source "${{ github.action_path }}/lib/severity.sh"

        if rafter_threshold_fails "$SEVERITY_THRESHOLD" "$CRITICAL_COUNT" "$HIGH_COUNT" "$MEDIUM_COUNT" "$LOW_COUNT"; then
          echo "::error::Security findings exceed severity threshold '${SEVERITY_THRESHOLD}'"
          exit 1
        fi

        echo "All findings are below severity threshold '${SEVERITY_THRESHOLD}'"
